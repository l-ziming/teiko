[project]
name = "teiko"
version = "0.1.0"
description = "Teiko Technical Assignment"
readme = "README.md"
authors = [
    { name = "liziming", email = "liziming99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
]

[project.scripts]
teiko = "teiko:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
